name: Calibrate SDK parity

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "Immutable Open XML SDK tag to calibrate against"
        required: true
        default: "v3.5.1"
  schedule:
    - cron: "17 2 * * 1"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    env:
      SDK_REF: ${{ forgejo.event.inputs.sdk_ref || 'v3.5.1' }}
      SDK_REPO: https://github.com/dotnet/Open-XML-SDK.git
      SDK_ROOT: /tmp/openxml-sdk-upstream
      CORPUS_ROOT: /tmp/openxml-sdk-seed
      RUNTIME_MANIFEST: /tmp/openxml-runtime-manifest.json
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: https://data.forgejo.org/actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        uses: https://data.forgejo.org/actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.x"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch immutable SDK release
        run: |
          set -euo pipefail
          rm -rf "$SDK_ROOT"
          git clone --depth 1 --branch "$SDK_REF" "$SDK_REPO" "$SDK_ROOT"
          git -C "$SDK_ROOT" rev-parse HEAD > /tmp/openxml-sdk-commit.txt
          printf '%s\n' "$SDK_REF" > /tmp/openxml-sdk-ref.txt

      - name: Materialize SDK corpus
        run: |
          rm -rf "$CORPUS_ROOT"
          python scripts/corpus/import_sdk_assets.py \
            --sdk-root "$SDK_ROOT" \
            --output-root "$CORPUS_ROOT"

      - name: Extract runtime manifest
        run: |
          cp data/corpus/sdk_seed/manifest.json "$RUNTIME_MANIFEST"
          python scripts/corpus/extract_sdk_expectations.py \
            --sdk-root "$SDK_ROOT" \
            --manifest "$RUNTIME_MANIFEST" \
            --output "$RUNTIME_MANIFEST"

      - name: Run parity snapshot against committed check universe
        run: |
          mkdir -p reports
          python scripts/corpus/run_parity_snapshot.py \
            --manifest data/corpus/sdk_seed/manifest.json \
            --files-root "$CORPUS_ROOT/files" \
            --output reports/parity_snapshot.json

      - name: Upload calibration evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parity-calibration
          path: |
            reports/parity_snapshot.json
            /tmp/openxml-runtime-manifest.json

      - name: Workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("reports/parity_snapshot.json")
          if not report.exists():
              Path("/tmp/parity_summary.md").write_text(
                  "# SDK parity calibration\n\nNo snapshot was produced.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))
          ref = Path("/tmp/openxml-sdk-ref.txt").read_text(encoding="utf-8").strip()
          commit = Path("/tmp/openxml-sdk-commit.txt").read_text(encoding="utf-8").strip()
          lines = [
              "# SDK parity calibration",
              "",
              f"- SDK ref: {ref}",
              f"- SDK commit: {commit}",
              f"- Checks total: {data.get('checks_total', 0)}",
              f"- Matched: {data.get('checks_matched', 0)}",
              f"- Mismatched: {data.get('checks_mismatched', 0)}",
              f"- Match rate: {data.get('match_rate_percent', 0)}%",
          ]
          Path("/tmp/parity_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat /tmp/parity_summary.md >> "$GITHUB_STEP_SUMMARY"
