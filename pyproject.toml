[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openxml-audit"
version = "0.7.4"
description = "Validate OOXML and ODF files in pure Python — no .NET required"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Bram Alkema"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
pptx-lab = [
    "python-pptx>=1.0.0",
]
odf-crypto = [
    "signxml>=4.0.0",
]
gsuite = [
    # `google-auth` only — we use stdlib `urllib.request` for the four
    # Drive API calls the oracle needs (avoids ~3 MB of transitive deps:
    # requests, urllib3, protobuf, httplib2, uritemplate, ...).
    "google-auth>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/BramAlkema/openxml-audit"
Repository = "https://github.com/BramAlkema/openxml-audit"
Issues = "https://github.com/BramAlkema/openxml-audit/issues"
Documentation = "https://bramalkema.github.io/openxml-audit/"

[project.scripts]
openxml-audit = "openxml_audit.cli:main"
openxml-audit-oracle = "openxml_audit.oracle.__main__:main"
openxml-audit-pptx-check = "openxml_audit.pptx.capabilities:main"
openxml-audit-pptx-lab = "openxml_audit.pptx.lab:main"
openxml-audit-pptx-timing-oracle = "openxml_audit.pptx.timing_oracle_deck:main"

[project.entry-points.pytest11]
openxml-audit = "openxml_audit.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/openxml_audit"]

[tool.hatch.build.targets.wheel.force-include]
"data/openxml" = "openxml_audit/data/openxml"
"data/pptx_oracle" = "openxml_audit/data/pptx_oracle"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These validator modules intentionally mirror OOXML element names from the spec.
"src/openxml_audit/pptx/slides.py" = ["N802", "N803", "N806"]
"src/openxml_audit/pptx/masters.py" = ["N802", "N806"]
"src/openxml_audit/pptx/themes.py" = ["N806"]
"src/openxml_audit/schema/constraints.py" = ["N806"]
# Raw XML fixture payloads are kept readable as copied package fragments.
"tests/test_properties.py" = ["E501"]
"tests/test_supertheme.py" = ["E501"]
"tests/test_word_compat_ordering.py" = ["E501"]
"tests/test_word_oracle_engine.py" = ["E501"]
"tests/test_word_oracle_smoke.py" = ["E501"]
# Oracle modules mirror OOXML element names from the spec and embed AppleScript.
"tools/oracle/scenarios/property_ordering.py" = ["N806"]
"tools/oracle/word_repair_oracle.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["openxml_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "requires_word_app: integration test that depends on Microsoft Word for Mac being installed and reachable via osascript. Skipped by default.",
]
