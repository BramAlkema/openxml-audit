[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openxml-audit"
version = "0.2.0"
description = "Validate OOXML and ODF files in pure Python — no .NET required"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Bram Alkema"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
odf-crypto = [
    "signxml>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/BramAlkema/openxml-audit"
Repository = "https://github.com/BramAlkema/openxml-audit"
Issues = "https://github.com/BramAlkema/openxml-audit/issues"
Documentation = "https://bramalkema.github.io/openxml-audit/"

[project.scripts]
openxml-audit = "openxml_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openxml_audit"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["openxml_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
