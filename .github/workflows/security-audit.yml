name: Security audit

# Advisory dependency vulnerability scan. Runs on a schedule (and on demand)
# rather than on pull_request: this is a library, so a blocking gate would go
# red whenever any transitive dependency picks up a new CVE and would block
# unrelated PRs. A failing scheduled run is the signal to review deps — same
# pattern as the parity/ODF drift jobs.

on:
  schedule:
    # Weekly: Mondays at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install package with all extras
        # setuptools is upgraded because the runner image ships an older one
        # than PyPI and pip-audit scans the whole environment, not just this
        # project's tree. Without this the scan goes red weekly on ambient
        # runner tooling (e.g. PYSEC-2026-3447 on setuptools 79.0.1 — a macOS
        # sdist-packing flaw, unreachable on an ubuntu runner building with
        # hatchling) and a chronically-red advisory stops being read.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev,pptx-lab,odf-crypto,gsuite]"

      - name: Run pip-audit
        # Non-zero exit when a known vulnerability is found. The editable local
        # package is not on PyPI and is skipped with a warning (not an error).
        run: pip-audit --desc
