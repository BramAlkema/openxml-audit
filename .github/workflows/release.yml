name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Smoke test wheel
        run: |
          python -m venv .release-venv
          .release-venv/bin/pip install dist/*.whl
          .release-venv/bin/python - <<'PY'
          from openxml_audit.codegen.schema_loader import get_registry as get_schema_registry
          from openxml_audit.codegen.schematron_loader import get_registry as get_schematron_registry

          schema_registry = get_schema_registry()
          schema_registry.load()
          schematron_registry = get_schematron_registry()
          schematron_registry.load()

          assert schema_registry.count_elements() > 0
          assert schematron_registry.count_rules() > 0
          PY

      - name: Smoke test packaged oracle dispatcher
        run: |
          for engine in word excel pptx odf gsuite preflight eurooffice; do
            .release-venv/bin/openxml-audit-oracle "$engine" --help >/dev/null
          done

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          prev_tag=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$prev_tag" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            changelog=$(git log --pretty=format:"- %s" "$prev_tag"..HEAD -- src/ scripts/ | head -50)
            # Write multiline output
            {
              echo "body<<EOF"
              echo "$changelog"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          generate_release_notes: true
